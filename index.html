<style>
:root{
  --bg:#0b1020; --surface:#111831; --surface2:#16203b; --text:#eef1f7; --muted:#94a0b8; --border:#243052;
  --accent:#2dd4bf; --accent-soft:rgba(45,212,191,.12); --amber:#f5a524; --amber-soft:rgba(245,165,36,.14);
  --glow1:rgba(45,212,191,.13); --glow2:rgba(245,165,36,.12); --shadow:0 12px 32px rgba(0,0,0,.4); --radius:14px;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Space Grotesk',system-ui,sans-serif; --display:'Inter Tight','Space Grotesk',system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#eef1f7; --text:#121829; --muted:#5a6479; --border:#dbe0ea;
  --accent:#0d9488; --accent-soft:rgba(13,148,136,.10); --amber:#c07400; --amber-soft:rgba(192,116,0,.10);
  --glow1:rgba(13,148,136,.10); --glow2:rgba(192,116,0,.08); --shadow:0 12px 32px rgba(20,30,50,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(55% 45% at 100% 0%,var(--glow1),transparent 70%),radial-gradient(50% 45% at 0% 100%,var(--glow2),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh;color:var(--text);font-family:var(--sans);line-height:1.6;overflow-x:hidden;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
#bg{position:fixed;inset:0;z-index:-1;opacity:.22}
.container{width:100%;margin:0 auto;padding:0 clamp(20px,3vw,56px)}

/* NAV */
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font-family:var(--mono);font-weight:500;color:var(--accent);display:flex;align-items:center;gap:10px}
.logo img{width:34px;height:34px;border-radius:9px;display:block}
@media(max-width:420px){.logo span{display:none}}
.nav-links{display:flex;gap:4px;align-items:center}
.nav-links a{font-size:.92rem;color:var(--muted);padding:7px 12px;border-radius:9px;transition:color .2s,background .2s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--text);background:var(--surface2)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),var(--amber));transition:width .4s ease}
.btn-icon{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;font-family:var(--mono);font-size:.8rem}
.btn-icon:hover{border-color:var(--accent)}
.menu-btn{display:none}
@media(max-width:860px){
  .nav-links{position:fixed;top:64px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);padding:14px 20px;border-bottom:1px solid var(--border);transform:translateY(-130%);transition:transform .3s}
  .nav-links.open{transform:none}
  .menu-btn{display:inline-block}
}

/* PAGES */
main{min-height:calc(100vh - 64px - 70px)}
.page{padding:64px 0 40px;animation:enter .45s ease}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}
.page-head{margin-bottom:40px;display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end}
.crumb{font-family:var(--mono);font-size:.78rem;color:var(--amber);margin-bottom:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:500}
.page-head h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.02;letter-spacing:-.035em}
.page-head p{color:var(--muted);margin-top:10px}
.page-art{width:200px;color:var(--accent)}
@media(max-width:700px){.page-head{grid-template-columns:1fr}.page-art{width:140px;order:-1}}
h2.sub{font-family:var(--mono);font-size:.78rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;margin:48px 0 16px}

/* HOME */
.hero{display:grid;grid-template-columns:1.7fr 1fr;gap:48px;align-items:start;padding-top:8px}
.pill{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
.tagline{font-family:var(--mono);font-size:.8rem;color:var(--amber);letter-spacing:.14em;text-transform:uppercase;margin:16px 0 14px;font-weight:500}
.headline{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,7.4vw,5.4rem);line-height:.98;letter-spacing:-.045em}
.headline .plus{color:var(--amber)} .headline .hi{color:var(--accent)}
.hero .lead{color:var(--text);opacity:.86;font-size:clamp(1.05rem,1.6vw,1.22rem);margin-top:22px}
.label{font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin:30px 0 12px}
.stack{display:flex;flex-wrap:wrap;gap:10px}
.stack .chip{font-size:.88rem;padding:9px 14px;border-radius:9px;background:var(--surface)}
.stack a.chip{transition:border-color .2s,color .2s}
.stack a.chip:hover{border-color:var(--accent);color:var(--accent)}
.hero-foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:44px;padding-top:26px;border-top:1px solid var(--border)}
.go{display:flex;align-items:center;gap:14px}
.round{width:46px;height:46px;border-radius:50%;background:var(--amber);color:#0b1020;display:grid;place-items:center;font-size:1.2rem;font-weight:700;flex:none;transition:transform .2s}
.go:hover .round{transform:translateX(4px)}
.go b{display:block;font-size:1.08rem}
.go small,.sign small{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.sign{text-align:right}
.sign b{display:block;font-family:var(--display);font-weight:800;letter-spacing:-.01em}
.sign small{color:var(--accent)}
.side{display:grid;gap:16px}
.kicker{font-family:var(--mono);color:var(--accent);font-size:.9rem;margin-bottom:12px}
.hero h1{font-size:clamp(2.6rem,7vw,4.6rem);line-height:1.02;font-weight:700;letter-spacing:-.025em}
.role{font-family:var(--mono);font-size:clamp(1rem,2.3vw,1.2rem);color:var(--text);margin:18px 0;min-height:1.8em}
.role .cursor{display:inline-block;width:9px;background:var(--accent);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lead{color:var(--muted);font-size:1.06rem}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:600;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:var(--sans);font-size:1rem;color:var(--text);transition:transform .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.primary{background:var(--amber);color:#0b1020;border-color:var(--amber)}
.portrait{position:relative;width:100%;aspect-ratio:1;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);color:var(--accent)}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait svg{width:100%;height:100%}
.portrait .initials{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(2rem,6vw,4.2rem);font-weight:700;color:var(--text)}
.highlights{display:grid;gap:12px}
.hl{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.hl b{display:block;font-family:var(--display);font-weight:800;font-size:1.45rem;color:var(--text);line-height:1.2}
.hl:first-child b{color:var(--amber)}
.hl span{color:var(--muted);font-size:.93rem}
@media(max-width:860px){.hero{display:flex;flex-direction:column;gap:28px}.side{display:contents}.portrait{order:-1;max-width:200px}.highlights{order:2}.sign{text-align:left}}

/* TIMELINE */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--border)}
.t-item{position:relative;margin-bottom:22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;display:grid;grid-template-columns:56px 1fr;gap:18px}
.t-item::before{content:"";position:absolute;left:-27px;top:28px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.t-logo{width:56px;height:56px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.t-logo svg{width:30px;height:30px}
.t-period{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.t-item h3{font-size:1.12rem;line-height:1.3}
.t-org{color:var(--accent);font-weight:500;font-size:.95rem}
.t-item ul{margin:10px 0 0 18px}
.t-item li{color:var(--muted);font-size:.95rem;margin-bottom:6px}
@media(max-width:600px){.t-item{grid-template-columns:1fr}.t-logo{width:44px;height:44px}}

/* PROJECTS */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.filter{font-family:var(--mono);font-size:.8rem;padding:7px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.filter:hover{color:var(--text)}
.filter.active{color:#0c0f15;background:var(--accent);border-color:var(--accent)}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:22px}
.p-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.p-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow)}
.p-img{aspect-ratio:16/9;background:var(--surface2);color:var(--accent);display:grid;place-items:center;border-bottom:1px solid var(--border);overflow:hidden}
.p-img img{width:100%;height:100%;object-fit:cover}
.p-img svg{width:100%;height:100%}
.p-body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.p-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.badge{color:var(--amber);text-transform:uppercase;letter-spacing:.1em}
.p-card h3{font-size:1.15rem;line-height:1.3}
.p-card p{color:var(--muted);font-size:.93rem;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:.76rem;padding:5px 11px;border-radius:8px;background:var(--surface2);border:1px solid var(--border)}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;max-width:900px;width:100%;max-height:90vh;overflow:auto;position:relative;animation:pop .25s}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal-close{position:absolute;top:12px;right:12px;z-index:2}
.modal-img{aspect-ratio:21/9;background:var(--surface2);color:var(--accent);overflow:hidden}
.modal-img svg,.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-inner{padding:26px 28px 30px}
.modal-inner h3{font-size:1.5rem;margin:6px 0 10px}
.modal-inner p,.modal-inner li{color:var(--muted);margin-top:10px}
.modal-inner ul{margin-left:18px}
.modal-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* RESEARCH */
.research{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.card h3{font-size:1.15rem;margin-bottom:8px}
.card p,.card li{color:var(--muted)}
.card ul{margin:10px 0 0 18px}
.card li{margin-bottom:6px}
.status{display:inline-block;font-family:var(--mono);font-size:.75rem;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px;margin-bottom:12px}
.card-art{color:var(--accent);margin:-4px 0 12px}
@media(max-width:860px){.research{grid-template-columns:1fr}}

/* SKILLS */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.skill{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.skill .ico{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.skill .ico svg{width:24px;height:24px}
.skill h3{font-size:1rem;margin-bottom:4px}
.skill p{color:var(--muted);font-size:.92rem}
.langs{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}

/* CONTACT */
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
.contact-list{display:grid;gap:12px}
.c-row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;transition:border-color .2s}
.c-row:hover{border-color:var(--accent)}
.c-row svg{width:22px;height:22px;color:var(--accent);flex:none}
.c-row small{display:block;color:var(--muted);font-size:.8rem}
@media(max-width:860px){.contact{grid-template-columns:1fr}}
.c-form{margin-top:24px;display:grid;gap:14px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.c-form label{display:grid;gap:6px;font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.c-form input,.c-form textarea{font:inherit;font-family:var(--sans);font-size:1rem;letter-spacing:0;text-transform:none;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;resize:vertical}
.c-form input:focus,.c-form textarea:focus{outline:none;border-color:var(--accent)}
.c-form .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.f-status{color:var(--muted);align-self:center;font-size:.92rem}
@media(max-width:700px){.f-grid{grid-template-columns:1fr}}

/* PAGER */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:64px;padding-top:28px;border-top:1px solid var(--border)}
.pager a{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;transition:border-color .2s,transform .2s}
.pager a:hover{border-color:var(--accent);transform:translateY(-2px)}
.pager small{display:block;color:var(--muted);font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em}
.pager b{font-size:1.1rem}
.pager .next{text-align:right;grid-column:2}
.dots{display:flex;justify-content:center;gap:8px;margin-top:22px}
.dots a{width:8px;height:8px;border-radius:50%;background:var(--border)}
.dots a.on{background:var(--amber);width:22px;border-radius:4px}
footer{text-align:center;padding:24px 0;color:var(--muted);font-family:var(--mono);font-size:.78rem;border-top:1px solid var(--border)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

let lang = store.get("lang") || ((navigator.language||"fr").startsWith("en") ? "en" : "fr");

const t = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] ?? v.fr ?? "") : (v ?? "");

function head(id, art){
  const u = UI[lang], i = ORDER.indexOf(id);
  return `<header class="page-head"><div>
      <div class="crumb">${u.page} ${i+1} / ${ORDER.length}</div>
      <h1>${u.pages[id]}</h1><p>${u.intro[id]||""}</p>
    </div><div class="page-art">${ART[art]}</div></header>`;
}
function pager(id){
  const u = UI[lang], i = ORDER.indexOf(id), p = ORDER[i-1], n = ORDER[i+1];
  return `<div class="pager">
      ${p ? `<a href="#/${p}"><small>← ${u.prev}</small><b>${u.pages[p]}</b></a>` : ""}
      ${n ? `<a class="next" href="#/${n}"><small>${u.next} →</small><b>${u.pages[n]}</b></a>` : ""}
    </div>
    <div class="dots">${ORDER.map(o=>`<a href="#/${o}" class="${o===id?"on":""}" aria-label="${u.pages[o]}"></a>`).join("")}</div>`;
}
function timeline(items){
  return `<div class="timeline">${items.map(x=>`
    <div class="t-item"><div class="t-logo">${ICON[x.icon]||ICON.lab}</div><div>
      ${x.period?`<div class="t-period">${esc(x.period)}</div>`:""}
      <h3>${esc(t(x.title))}</h3><div class="t-org">${esc(t(x.org))}</div>
      <ul>${(t(x.details)||[]).map(d=>`<li>${esc(d)}</li>`).join("")}</ul>
    </div></div>`).join("")}</div>`;
}
function card(p, i){
  return `<article class="p-card" data-i="${i}" tabindex="0">
    <div class="p-img">${media(p.image, p.art)}</div>
    <div class="p-body">
      <div class="p-meta"><span class="badge">${esc(t(p.badge)||"")}</span><span>${esc(t(p.year)||"")}</span></div>
      <h3>${esc(t(p.title))}</h3><p>${esc(t(p.summary))}</p>
      <div class="chips">${p.tags.map(g=>`<span class="chip">${esc(g)}</span>`).join("")}</div>
    </div></article>`;
}
function grid(){ return DATA.projects.map((p,i)=>({p,i})).filter(({p})=>!filter||p.tags.includes(filter)).map(({p,i})=>card(p,i)).join(""); }

function render(){
  const u = UI[lang], id = current();
  document.documentElement.lang = lang;
  document.title = `${DATA.name} — ${u.pages[id]}`;
  document.getElementById("langBtn").textContent = lang==="fr" ? "EN" : "FR";
  document.getElementById("navLinks").innerHTML = ORDER.map(o=>`<a href="#/${o}" class="${o===id?"active":""}">${u.pages[o]}</a>`).join("");
  document.getElementById("progress").style.width = `${(ORDER.indexOf(id)+1)/ORDER.length*100}%`;
  document.getElementById("app").innerHTML = PAGES[id]();
  document.getElementById("footer").textContent = `${u.made} ${DATA.name} · © ${new Date().getFullYear()}`;
  document.getElementById("navLinks").classList.remove("open");
  bind();
  clearTimeout(typingTimer);
  if(id==="accueil") startTyping();
}
const emailAddr = () => DATA.email.user + "@" + DATA.email.domain;
function bindContact(){
  const u = UI[lang];
  const rv = document.getElementById("revealEmail");
  if(rv) rv.onclick = async ()=>{
    const a = emailAddr(), txt = document.getElementById("emailText");
    if(txt.dataset.shown){ try{ await navigator.clipboard.writeText(a); rv.textContent = u.copied; }catch(e){} return; }
    txt.innerHTML = `<a href="mailto:${a}" style="color:var(--text)">${a}</a>`; txt.dataset.shown = "1"; rv.textContent = u.copy;
  };
  const mb = document.getElementById("mailBtn");
  if(mb) mb.onclick = ()=>{ location.href = "mailto:" + emailAddr(); };
  const f = document.getElementById("contactForm");
  if(f) f.onsubmit = async e=>{
    e.preventDefault();
    const st = document.getElementById("formStatus"), btn = f.querySelector("button[type=submit]");
    if(!f.checkValidity()){ st.textContent = u.fInvalid; return; }
    if(f._gotcha.value) return;
    btn.disabled = true; st.textContent = u.sending;
    try{
      const r = await fetch("https://formspree.io/f/" + encodeURIComponent(DATA.formspree), {
        method:"POST", headers:{ "Accept":"application/json" }, body: new FormData(f) });
      if(r.ok){ f.reset(); st.textContent = u.sent; } else { st.textContent = u.failed; }
    }catch(err){ st.textContent = u.failed; }
    btn.disabled = false;
  };
}
function bind(){
  bindContact();
  document.querySelectorAll("[data-open]").forEach(a=>a.onclick=()=>{ pendingOpen = +a.dataset.open; });
  if(pendingOpen!==null && current()==="projets"){ const i = pendingOpen; pendingOpen = null; setTimeout(()=>openModal(i), 250); }
  document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{
    filter = b.dataset.tag || null;
    document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active", x===b));
    document.getElementById("projectGrid").innerHTML = grid(); bindCards();
  });
  bindCards();
}
function bindCards(){
  document.querySelectorAll(".p-card").forEach(c=>{
    const open = ()=>openModal(+c.dataset.i);
    c.onclick = open; c.onkeydown = e=>{ if(e.key==="Enter") open(); };
  });
}
function openModal(i){
  const p = DATA.projects[i], u = UI[lang];
  const links = Object.entries(p.links||{}).filter(([,v])=>v).map(([k,v])=>`<a class="btn" href="${esc(v)}" target="_blank" rel="noopener">${esc(k)} ↗</a>`).join("");
  document.getElementById("modalContent").innerHTML = `
    <div class="modal-img">${media(p.image, p.art)}</div>
    <div class="modal-inner">
      <div class="p-meta"><span class="badge">${esc(t(p.badge)||"")}</span><span>${esc(t(p.year)||"")}</span></div>
      <h3>${esc(t(p.title))}</h3>
      <div class="chips">${p.tags.map(g=>`<span class="chip">${esc(g)}</span>`).join("")}</div>
      <p>${esc(t(p.summary))}</p>
      <ul>${(t(p.details)||[]).map(d=>`<li>${esc(d)}</li>`).join("")}</ul>
      ${links?`<div class="modal-links">${links}</div>`:""}
    </div>`;
  document.getElementById("modal").classList.add("open");
}
const modal = document.getElementById("modal");
const closeModal = ()=>modal.classList.remove("open");
document.getElementById("modalClose").onclick = closeModal;
modal.onclick = e=>{ if(e.target===modal) closeModal(); };

/* Navigation : liens, flèches du clavier, balayage sur mobile */
function go(step){ const i = ORDER.indexOf(current()) + step; if(ORDER[i]) location.hash = "#/"+ORDER[i]; }
addEventListener("hashchange", ()=>{ closeModal(); render(); scrollTo({top:0, behavior:"instant"}); });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") return closeModal();
  if(modal.classList.contains("open") || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==="ArrowRight") go(1); if(e.key==="ArrowLeft") go(-1);
});
let tx=null;
addEventListener("touchstart", e=>{ tx = e.touches[0].clientX; }, {passive:true});
addEventListener("touchend", e=>{ if(tx===null) return; const dx = e.changedTouches[0].clientX - tx; if(Math.abs(dx)>90 && !modal.classList.contains("open")) go(dx<0?1:-1); tx=null; });

/* Machine à écrire */
function startTyping(){
  const roles = t(DATA.roles), el = document.getElementById("typed"); if(!el) return;
  let r=0, c=0, del=false;
  (function tick(){
    const w = roles[r]; el.textContent = w.slice(0,c);
    if(!del && c<w.length){ c++; typingTimer=setTimeout(tick,50); }
    else if(!del){ del=true; typingTimer=setTimeout(tick,1700); }
    else if(c>0){ c--; typingTimer=setTimeout(tick,25); }
    else { del=false; r=(r+1)%roles.length; typingTimer=setTimeout(tick,300); }
  })();
}

/* Contrôles */
function applyTheme(){ document.documentElement.dataset.theme = theme; document.getElementById("themeBtn").textContent = theme==="dark" ? "☀" : "☾"; }
document.getElementById("themeBtn").onclick = ()=>{ theme = theme==="dark"?"light":"dark"; store.set("theme",theme); applyTheme(); };
document.getElementById("langBtn").onclick = ()=>{ lang = lang==="fr"?"en":"fr"; store.set("lang",lang); render(); };
document.getElementById("menuBtn").onclick = ()=>document.getElementById("navLinks").classList.toggle("open");

/* Fond : réseau discret, une seule couleur */
(function(){
  const cv = document.getElementById("bg"), ctx = cv.getContext("2d");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let W,H,pts,col="#6ee7c8",n=0;
  function init(){ W=cv.width=innerWidth; H=cv.height=innerHeight;
    pts = Array.from({length:Math.min(60,Math.floor(W*H/24000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3})); }
  function frame(){
    if(n++%30===0) col = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    ctx.clearRect(0,0,W,H); ctx.strokeStyle=col; ctx.fillStyle=col;
    for(const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1; }
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){ const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
        if(d<130){ ctx.globalAlpha=(1-d/130)*.35; ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke(); } }
      ctx.globalAlpha=.6; ctx.beginPath(); ctx.arc(pts[i].x,pts[i].y,1.6,0,7); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  addEventListener("resize", init); init(); frame();
})();

applyTheme();
render();
</script>
